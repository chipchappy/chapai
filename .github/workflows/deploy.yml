name: Deploy

on:
  push:
    branches: [main, dev]

jobs:
  deploy-chapai:
    name: Deploy ChapAI Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Guard canonical brain writes
        working-directory: ${{ github.workspace }}
        run: node scripts/ops/guard-canonical-brain-writes.mjs

      - name: Build
        run: npm run build:worker

      - name: Set OPENROUTER_API_KEY → staging
        if: github.ref == 'refs/heads/dev'
        run: echo "${{ secrets.OPENROUTER_API_KEY }}" | npx wrangler secret put OPENROUTER_API_KEY --name chapai-web-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy → STAGING
        if: github.ref == 'refs/heads/dev'
        run: npx wrangler deploy --config wrangler.staging.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # PRODUCTION DEPLOYS FROM CI ARE DISABLED (2026-07-02).
      # `main` is the Phase-4 proposal shelf, several features ahead of the
      # canonical live site — auto-deploying it caused the revert cycle.
      # The ONLY sanctioned production path is the smoke-gated script on the
      # `stable` branch: bash scripts/deploy-stable.sh (see TESTING.md).
      - name: Production deploy disabled — use scripts/deploy-stable.sh from `stable`
        if: github.ref == 'refs/heads/main'
        run: echo "Refusing CI prod deploy. main is not the deploy lineage; ship via scripts/deploy-stable.sh on stable."
